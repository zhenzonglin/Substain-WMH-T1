[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "substain-features"
version = "1.0.9"
description = "WMH-T1 40维结构影像特征工程"
requires-python = ">=3.8"
dependencies = [
  "click>=8.1,<9",
  "nibabel>=5.1,<6",
  "numpy>=1.24,<2",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
substain-features = "substain_features.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
